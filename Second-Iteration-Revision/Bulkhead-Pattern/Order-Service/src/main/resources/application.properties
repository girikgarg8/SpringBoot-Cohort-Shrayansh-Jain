server.port=8081
spring.application.name=order-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ==================== THREADPOOL BULKHEAD CONFIGURATION ====================
# Max 3 threads in the pool and that's the max pool size too.
# If all 3 threads are busy, max 2 more requests will be put into queue
# From 6th request onwards, it will start rejecting the requests.

# Core thread pool size - minimum threads always alive
resilience4j.thread-pool-bulkhead.instances.productServiceThreadPool.coreThreadPoolSize=3

# Max thread pool size - maximum threads that can be created
resilience4j.thread-pool-bulkhead.instances.productServiceThreadPool.maxThreadPoolSize=3

# Queue capacity - how many requests can wait when all threads are busy
# Requests 1-3: Execute immediately (using 3 threads)
# Requests 4-5: Wait in queue (queue capacity = 2)
# Request 6+: Rejected immediately (pool full + queue full)
resilience4j.thread-pool-bulkhead.instances.productServiceThreadPool.queueCapacity=2

# ==================== SEMAPHORE BULKHEAD CONFIGURATION ====================
# Only 2 concurrent calls allowed (permit-based)
# No separate thread pool - uses calling thread
# Lightweight and executes synchronously

# Maximum concurrent calls allowed
resilience4j.bulkhead.instances.productServiceSemaphore.maxConcurrentCalls=2

# maxWaitDuration=0 means immediate rejection if no permit available
# Set to 0 for TESTING to demonstrate immediate rejection behavior
# In production: Set based on use case
#   - User-facing APIs: 0-300ms (fail fast for better UX)
#   - Background jobs: 1s-5s (maximize success rate)
#   - Bursty traffic: 500ms-1s (allow brief waiting for permit)
resilience4j.bulkhead.instances.productServiceSemaphore.maxWaitDuration=0

