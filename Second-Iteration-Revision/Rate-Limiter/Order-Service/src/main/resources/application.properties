server.port=8081
spring.application.name=order-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ==================== RESILIENCE4J RATE LIMITER CONFIGURATION ====================
# Endpoint: /orders/resilience4j/{id}
# Token Bucket Algorithm with fixed refresh period

# Bucket filled with 2 tokens every 10second,
# If there is no token wait for 1sec before rejecting the request

# Number of permissions/requests available during one refresh period
# 2 requests are allowed within the limitRefreshPeriod
resilience4j.ratelimiter.instances.productRateLimiter.limitForPeriod=2

# Period after which the rate limiter refreshes and allows new requests
# Every 10 seconds, the bucket is refilled with 2 tokens
resilience4j.ratelimiter.instances.productRateLimiter.limitRefreshPeriod=10s

# Time a thread waits for permission before it gets rejected
# If no token available, wait for 1 second before rejecting
resilience4j.ratelimiter.instances.productRateLimiter.timeoutDuration=1s

# ==================== CUSTOM RATE LIMITER ====================
# Endpoint: /orders/custom/products
# Sliding Window Algorithm - configured via @CustomRateLimiter annotation
# Config: limit=5, windowInSeconds=60 (5 requests per 60 seconds)
# Implementation: CustomRateLimiterAspect using AOP

