server.port=8081
spring.application.name=order-service

# Base URL for Product Service (used by Feign Client)
feign.client.product-service.url=http://localhost:8082

# ========== Feign Client Timeout Configuration ==========

# Request and connection timeout applicable to ONLY product-service-timeout FeignClient
# The name "product-service-timeout" matches the name attribute in @FeignClient(name = "product-service-timeout")
feign.client.config.product-service-timeout.connectTimeout=1000
feign.client.config.product-service-timeout.readTimeout=2000

# Request and connection timeout applicable for ALL FeignClient (commented out to not interfere)
# Use "default" to apply configuration to all Feign clients
#feign.client.config.default.connectTimeout=3000
#feign.client.config.default.readTimeout=5000

# Note: Specific client configuration (like product-service-timeout) takes precedence over default


