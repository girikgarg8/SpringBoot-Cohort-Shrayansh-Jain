server.port=8083

spring.application.name=order-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#product service - circuit breaker configurations

# Sliding Window Type: Determines how the circuit breaker tracks calls
# COUNT_BASED: Tracks last N calls (e.g., last 10 calls) - Good for low/medium traffic
# TIME_BASED: Tracks calls in last N seconds (e.g., last 60 seconds) - Good for high traffic with varying load
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED

# Sliding Window Size: 
# For COUNT_BASED: Number of calls to track (here: last 10 calls)
# For TIME_BASED: Number of seconds to track (e.g., 60 means last 60 seconds)
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Minimum Number of Calls: Minimum calls required before circuit breaker can calculate failure rate
# Circuit won't open until at least this many calls are recorded (here: 5 calls)
# Prevents circuit from opening due to a single failure - needs statistical significance
# Example: Even if first 2 calls fail (100% failure), circuit stays CLOSED until 5 calls are made
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

# By default, circuit breaker records ALL exceptions as failures (which is what we want for demo)
# Only use record-exceptions if you want to be selective about which exceptions trigger the circuit
# Example: Record only specific exceptions that should trigger circuit breaker
#resilience4j.circuitbreaker.instances.productService.record-exceptions=java.io.IOException,feign.FeignException,feign.RetryableException,org.springframework.web.client.ResourceAccessException

# Use ignore-exceptions to exclude certain exceptions from triggering the circuit breaker
# Example: Don't open circuit for client errors (4xx) or validation errors
#resilience4j.circuitbreaker.instances.productService.ignore-exceptions=java.lang.IllegalArgumentException,feign.FeignException.BadRequest,feign.FeignException.NotFound
