server.port=8081

spring.application.name=order-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ==========================================
# FIXED INTERVAL RETRY
# ==========================================
# Fixed delay interval - waits 2 seconds between each retry
resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=2s

# ==========================================
# EXPONENTIAL BACKOFF RETRY
# ==========================================
# Initial wait time - first retry after 1 second
resilience4j.retry.instances.productServiceExponential.maxAttempts=4
resilience4j.retry.instances.productServiceExponential.waitDuration=1s
# Enable exponential backoff - multiplies wait time by this factor each retry
resilience4j.retry.instances.productServiceExponential.enableExponentialBackoff=true
resilience4j.retry.instances.productServiceExponential.exponentialBackoffMultiplier=2

# ==========================================
# EXPONENTIAL BACKOFF WITH JITTER (RANDOMIZATION)
# ==========================================
# Same as exponential backoff but adds randomness to prevent thundering herd
resilience4j.retry.instances.productServiceJitter.maxAttempts=4
resilience4j.retry.instances.productServiceJitter.waitDuration=1s
resilience4j.retry.instances.productServiceJitter.enableExponentialBackoff=true
resilience4j.retry.instances.productServiceJitter.exponentialBackoffMultiplier=2
# Adds randomization to retry delays to avoid all clients retrying simultaneously
resilience4j.retry.instances.productServiceJitter.enableRandomizedWait=true

# Note: Custom retry strategy is defined programmatically in Config.java
