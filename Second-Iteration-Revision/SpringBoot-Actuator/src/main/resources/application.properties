spring.application.name=springboot-actuator-demo

# ============================================
# SECURITY CONFIGURATION
# ============================================
# Configure basic authentication credentials for actuator endpoints
spring.security.user.name=user
spring.security.user.password=password
spring.security.user.roles=ADMIN

# ============================================
# ACTUATOR ENDPOINT CONFIGURATION
# ============================================
# By default, actuator endpoints are available at /actuator (e.g., /actuator/health)
# OPTIONAL: You can change the base path to something else like /manage
management.endpoints.web.base-path=/actuator

# By default, only '/actuator/health' & '/actuator/info' endpoints are exposed
# '*' exposes all endpoints (health, info, metrics, env, beans, mappings, loggers, etc.)
# Custom endpoints (like my-custom-stats) are also included when using '*'
# Use comma-separated list to expose specific endpoints: my-custom-stats,health,info
management.endpoints.web.exposure.include=my-custom-stats,health,info

# Show detailed health information including custom health indicators
# Options: never, when-authorized, always
management.endpoint.health.show-details=always

# ============================================
# CRITICAL SECURITY NOTE
# ============================================
# By default, access to all endpoints except for "/shutdown" and "/heapdump" is unrestricted
# 
# Both these endpoints are very critical:
# - /shutdown can stop your application
# - /heapdump can expose sensitive information about your application like tokens, passwords etc.
#
# So, by default they are restricted and we need to specifically unrestrict them
# (assuming we have accepted the risk involved - ONLY FOR DEMO/DEVELOPMENT)
#
# Make it require authentication in PRODUCTION or don't enable these at all!
management.endpoint.heapdump.access=unrestricted
management.endpoint.shutdown.enabled=true

# ============================================
# DATADOG METRICS EXPORT CONFIGURATION
# ============================================
# Replace with your actual Datadog API key from https://app.datadoghq.com/organization-settings/api-keys
management.datadog.metrics.export.apiKey=masked

# When set to true, metrics will be exported to Datadog
# Set to false if you want to disable Datadog export temporarily
management.datadog.metrics.export.enabled=true

# How frequently to push metrics to Datadog (default is 1 minute)
# Every 5 seconds it will push the metrics to Datadog
management.datadog.metrics.export.step=5s

# Datadog site (US: datadoghq.com, EU: datadoghq.eu)
# For US accounts, use: api.datadoghq.com
# For EU accounts, use: api.datadoghq.eu
management.datadog.metrics.export.uri=https://api.datadoghq.com

