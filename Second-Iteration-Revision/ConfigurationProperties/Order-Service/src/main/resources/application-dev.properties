custom.message=Hello from local dev!

# ============================================
# SERVER SETTINGS - LOCAL ONLY (NOT FROM CONFIG SERVER)
# These properties demonstrate validation constraints
# ============================================

# @NotBlank validation - Cannot be empty or whitespace
server-settings.environment=development

# @Min(1024) @Max(65535) validation - Must be between 1024 and 65535
server-settings.port=8090

# @Positive validation - Must be > 0
server-settings.timeout-seconds=30

# @Pattern validation - Must match: [A-Z]{2}-[0-9]{4} (e.g., US-1234)
server-settings.server-id=IN-5678

# ============================================
# IMMUTABLE SERVER SETTINGS - CONSTRUCTOR BINDING
# Same validations as above, but using immutable pattern
# ============================================

immutable-server-settings.environment=production
immutable-server-settings.port=8443
immutable-server-settings.timeout-seconds=60
immutable-server-settings.server-id=US-1234

# User Configuration Properties
user-config.admin-email=admin@example.com
user-config.feature-flags[0]=feature-1
user-config.feature-flags[1]=feature-2
user-config.users[0].name=John
user-config.users[0].email=john@example.com
user-config.users[0].role=admin
user-config.users[1].name=Jane
user-config.users[1].email=jane@example.com
user-config.users[1].role=user

# Nested object binding (requires static nested class)
user-config.address.city=San Francisco
user-config.address.country=USA

# Map<String, String> - Simple key-value pairs
user-config.preferences.theme=dark
user-config.preferences.language=en
user-config.preferences.timezone=IST

# List<Course> - List of nested static class objects
user-config.courses[0].name=Java-Springboot
user-config.courses[0].enrolled=true
user-config.courses[1].name=Python-Django
user-config.courses[1].enrolled=false

# Map<String, AddressConfig> - Map of nested static class objects
user-config.locations.home.city=Jaipur
user-config.locations.home.country=India
user-config.locations.office.city=Delhi
user-config.locations.office.country=India
